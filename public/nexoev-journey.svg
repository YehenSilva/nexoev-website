<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="nxT nxD" class="nexo-hero">
<title id="nxT">NexoEV journey animation</title>
<desc id="nxD">An electric car drives a route while the battery gauge drops and shows the estimated arrival charge, passing trusted charging stations.</desc>
<style>
.nexo-hero{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--accent:#10b981;--accent-2:#0ea5e9;--warn:#f59e0b;font-family:Roboto,Inter,system-ui,sans-serif}
.nexo-hero text{font-family:inherit}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.pulse.d1{animation-delay:.9s}.pulse.d2{animation-delay:1.8s}
@keyframes pulse{0%{transform:scale(.3);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.dash{stroke-dasharray:2 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
@media (prefers-reduced-motion:reduce){.pulse,.float,.dash{animation:none}}
</style>
<defs>
<linearGradient id="nxG" x1="0" x2="1"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient>
<filter id="nxS" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
<path id="nxR" pathLength="100" d="M110 400 C250 400 250 255 400 255 S560 370 690 305 S810 175 850 160"/>
</defs>

<g>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.95;1" dur="10s" repeatCount="indefinite"/>

<!-- map texture -->
<g fill="none" stroke="var(--line)" stroke-width="1">
<path d="M0 120H960M0 240H960M0 360H960M0 480H960M160 0V540M320 0V540M480 0V540M640 0V540M800 0V540" stroke-dasharray="2 8"/>
</g>
<ellipse cx="240" cy="150" rx="150" ry="60" fill="var(--soft)"/>
<ellipse cx="760" cy="460" rx="170" ry="48" fill="var(--soft)"/>

<!-- range ring at origin -->
<circle cx="110" cy="400" r="46" fill="none" stroke="var(--accent)" stroke-width="2" class="pulse"/>
<circle cx="110" cy="400" r="46" fill="none" stroke="var(--accent)" stroke-width="2" class="pulse d1"/>
<circle cx="110" cy="400" r="46" fill="none" stroke="var(--accent)" stroke-width="2" class="pulse d2"/>

<!-- route -->
<use href="#nxR" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
<use href="#nxR" fill="none" stroke="url(#nxG)" stroke-width="5" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100">
<animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.02;0.8;1" dur="10s" repeatCount="indefinite"/>
</use>
<use href="#nxR" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" class="dash" opacity=".9"/>

<!-- origin -->
<circle cx="110" cy="400" r="9" fill="#fff" stroke="var(--accent-2)" stroke-width="4"/>
<text x="110" y="440" text-anchor="middle" font-size="13" fill="var(--muted)">Start</text>

<!-- charging stations -->
<g transform="translate(405 330)">
<circle r="16" fill="none" stroke="var(--accent-2)" stroke-width="2" class="pulse"/>
<g filter="url(#nxS)"><circle r="16" fill="#fff"/></g>
<path d="M2 -9 L-5 2 H0 L-2 9 L5 -2 H0 Z" fill="var(--accent-2)"/>
<g transform="translate(24 -12)"><rect width="62" height="22" rx="11" fill="#fff" stroke="var(--line)"/><circle cx="13" cy="11" r="4" fill="var(--accent)"/><text x="23" y="15" font-size="11.5" font-weight="700" fill="var(--ink)">4.7 trust</text></g>
</g>
<g transform="translate(610 240)">
<circle r="16" fill="none" stroke="var(--accent-2)" stroke-width="2" class="pulse d1"/>
<g filter="url(#nxS)"><circle r="16" fill="#fff"/></g>
<path d="M2 -9 L-5 2 H0 L-2 9 L5 -2 H0 Z" fill="var(--accent-2)"/>
<g transform="translate(-86 -34)"><rect width="62" height="22" rx="11" fill="#fff" stroke="var(--line)"/><circle cx="13" cy="11" r="4" fill="var(--warn)"/><text x="23" y="15" font-size="11.5" font-weight="700" fill="var(--ink)">4.1 trust</text></g>
</g>

<!-- destination -->
<g transform="translate(850 160)">
<circle r="26" fill="none" stroke="var(--accent)" stroke-width="2" class="pulse d2"/>
<path d="M0 -4 C-14 -4 -14 -34 0 -34 C14 -34 14 -4 0 -4 Z" transform="translate(0 4) scale(1.25) translate(0 18)" fill="none"/>
<g transform="translate(0 -34)"><path d="M0 10 C-18 -10 -16 -34 0 -34 C16 -34 18 -10 0 10 Z" fill="var(--ink)"/><circle cy="-20" r="6" fill="#fff"/></g>
</g>

<!-- car -->
<g>
<animateMotion dur="10s" repeatCount="indefinite" rotate="auto" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.02;0.8;1"><mpath href="#nxR"/></animateMotion>
<g filter="url(#nxS)" transform="scale(1.45)">
<rect x="-14" y="-13" width="9" height="5" rx="2" fill="#334155"/><rect x="7" y="-13" width="9" height="5" rx="2" fill="#334155"/>
<rect x="-14" y="8" width="9" height="5" rx="2" fill="#334155"/><rect x="7" y="8" width="9" height="5" rx="2" fill="#334155"/>
<rect x="-22" y="-10" width="44" height="20" rx="9" fill="var(--ink)"/>
<path d="M4 -7 L12 -5 Q14 0 12 5 L4 7 Z" fill="#cbd5e1"/>
<rect x="-12" y="-6" width="12" height="12" rx="3" fill="#1e293b"/>
<path d="M-4 -4 L-8 1 H-5 L-6 4 L-1 -1 H-4 Z" fill="var(--accent)"/>
<circle cx="20" cy="-6" r="1.5" fill="#fde68a"/><circle cx="20" cy="6" r="1.5" fill="#fde68a"/>
</g>
</g>

<!-- battery card -->
<g class="float">
<g transform="translate(60 48)" filter="url(#nxS)">
<rect width="270" height="108" rx="18" fill="#fff" stroke="var(--line)"/>
<text x="22" y="30" font-size="12" font-weight="600" letter-spacing=".08em" fill="var(--muted)">BATTERY ON ARRIVAL</text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">100%<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.150;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">100%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.150;0.243;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">91%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.243;0.336;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">82%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.336;0.429;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">73%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.429;0.521;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">64%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.521;0.614;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">55%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.614;0.707;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">46%<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.707;0.800;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="22" y="72" font-size="34" font-weight="800" fill="var(--ink)" opacity="0">34%<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.800;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<rect x="22" y="84" width="226" height="10" rx="5" fill="var(--soft)"/>
<rect x="22" y="84" width="226" height="10" rx="5" fill="url(#nxG)">
<animate attributeName="width" values="226;226;77;77" keyTimes="0;0.15;0.8;1" dur="10s" repeatCount="indefinite"/>
</rect>
<g transform="translate(200 40)"><rect width="50" height="22" rx="11" fill="var(--accent)" opacity=".12"/><text x="25" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="var(--accent)">±4% conf.</text></g>
</g>
</g>

<!-- arrival badge -->
<g transform="translate(850 62)" opacity="0">
<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.86;1" dur="10s" repeatCount="indefinite"/>
<animateTransform attributeName="transform" type="translate" values="850 74;850 74;850 62;850 62" keyTimes="0;0.8;0.88;1" dur="10s" repeatCount="indefinite"/>
<g filter="url(#nxS)"><rect x="-70" y="-26" width="140" height="34" rx="17" fill="#fff" stroke="var(--accent)"/></g>
<circle cx="-50" cy="-9" r="6" fill="var(--accent)"/><path d="M-53 -9 l2 2 l4 -4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="-36" y="-4" font-size="12" font-weight="700" fill="var(--ink)">Arrive with 34%</text>
</g>
</g>
</svg>